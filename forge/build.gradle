plugins {
    id 'eclipse'
    id 'idea'
    id 'maven-publish'
    id 'net.minecraftforge.gradle' version '[6.0,6.2)'
    id 'org.spongepowered.mixin' version '0.7.+'
}

rootProject.ext.loadModProperties(project, 'TS_MultiTools')

mixin {
    add sourceSets.main, "ts_multitools.forge.refmap.json"
    config "ts_multitools.forge.mixins.json"
}


rootProject.ext.configureForgeMinecraft(project) {
    "${mod_id}" {
        source sourceSets.main
        source project(':TS_MultiTools:common').sourceSets.main
    }
    "tokorotenslime" {
        source project(':TokorotenSlime:forge').sourceSets.main
        source project(':TokorotenSlime:common').sourceSets.main
    }
}

dependencies {
    implementation project(':TS_MultiTools:common')

    implementation project(':TokorotenSlime:forge')
    implementation project(':TokorotenSlime:common')
}

rootProject.ext.configureForgeModule(project, ':TS_MultiTools:common')
