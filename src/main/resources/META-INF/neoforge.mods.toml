license="${mod_license}"
issueTrackerURL="https://github.com/kasaradanamo/TS-MultiTools/issues"

[[mods]]
modId="${mod_id}"
version="${mod_version}"
displayName="${mod_name}"
#updateJSONURL="https://change.me.example.invalid/updates.json"
displayURL="https://modrinth.com/mod/ts-multitools"
logoFile="icon.png"
#credits=""
authors="Kasara"
description="Add MultiTools to TokorotenSlime."

[[mixins]]
config="${mod_id}.mixins.json"

[[dependencies.${mod_id}]]
    modId="neoforge"
    type="required"
    versionRange="[${neo_version},)"
    ordering="NONE"
    side="BOTH"

[[dependencies.${mod_id}]]
    modId="minecraft"
    type="required"
    versionRange="${minecraft_version_range}"
    ordering="NONE"
    side="BOTH"

[[dependencies.${mod_id}]]
    modId="tokorotenslime"
    type="required"
    versionRange="[1.2,)"
    ordering="NONE"
    side="BOTH"
