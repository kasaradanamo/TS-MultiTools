plugins {
    id 'idea'
}

allprojects {
    repositories {
        mavenCentral()
        maven {
            name = 'Fabric'
            url = 'https://maven.fabricmc.net/'
        }
        maven {
            name = 'MinecraftForge'
            url = 'https://maven.minecraftforge.net/'
        }
        maven {
            name = 'SpongePowered'
            url = 'https://repo.spongepowered.org/repository/maven-public/'
        }
    }
}

subprojects {
    // Java 17・UTF-8(common/forge/fabric共通)
    plugins.withId('java') {
        java {
            sourceCompatibility = JavaVersion.VERSION_17
            targetCompatibility = JavaVersion.VERSION_17
            toolchain.languageVersion = JavaLanguageVersion.of(17)
        }
    }
    tasks.withType(JavaCompile).configureEach {
        options.encoding = 'UTF-8'
    }

    // Loom(common/fabric)共通のMinecraft依存・マッピング指定
    // (minecraft_version/loom_versionはルート直下gradle.propertiesから全プロジェクトへ自動供給される)
    pluginManager.withPlugin('fabric-loom') {
        dependencies {
            minecraft "com.mojang:minecraft:${project.minecraft_version}"
            mappings loom.officialMojangMappings()

            // commonはLoomの一部機能がfabric-loaderの存在を前提にしているため念のため追加
            // (common自体はFabric固有APIを一切参照しない。fabricモジュール側はmodImplementationで別途追加する)
            if (project.name == 'common') {
                compileOnly "net.fabricmc:fabric-loader:${project.loader_version}"
            }
        }
    }

    // Forge(forge)共通のMinecraft依存
    pluginManager.withPlugin('net.minecraftforge.gradle') {
        dependencies {
            minecraft "net.minecraftforge:forge:${project.minecraft_version}-${project.forge_version}"
        }
    }

    // Mixin(forge側でMixinを使うモジュール)共通のrefmap生成用アノテーションプロセッサ
    pluginManager.withPlugin('org.spongepowered.mixin') {
        dependencies {
            annotationProcessor 'org.spongepowered:mixin:0.8.5:processor'
        }
    }

    // Forge(forge)共通のpublishing設定(mod_id等mod固有プロパティを含まないため無条件で適用可能)。
    // withPlugin適用直後はまだjarタスクが存在しないプラグイン適用順のため、afterEvaluateまで遅延する
    pluginManager.withPlugin('maven-publish') {
        afterEvaluate {
            publishing {
                publications {
                    register('mavenJava', MavenPublication) {
                        artifact tasks.named('jar')
                    }
                }
                repositories {
                    maven {
                        url "file://${project.projectDir}/mcmodsrepo"
                    }
                }
            }
        }
    }
}

// 各mod配下のgradle.properties(mod_id等)をサブプロジェクトのext変数として読み込み、version/groupも設定する。
ext.loadModProperties = { Project project, String modDirName ->
    def modProps = new Properties()
    file("${rootDir}/${modDirName}/gradle.properties").withInputStream { modProps.load(it) }
    modProps.each { key, value -> project.ext[key] = value }
    project.version = modProps.getProperty('mod_version')
    project.group = modProps.getProperty('mod_group_id')
}

// Forge(forge)モジュール共通のminecraft{}ブロック(mappings・runs・データ生成)。
// modsClosureはrunsで読み込むmod一覧の設定(モジュールごとに異なる依存mod構成のみ個別指定させる)。
ext.configureForgeMinecraft = { Project project, Closure modsClosure ->
    project.minecraft {
        mappings channel: project.mapping_channel, version: project.mapping_version

        copyIdeResources = true

        runs {
            configureEach {
                workingDirectory project.file('run')

                property 'forge.logging.markers', 'REGISTRIES'
                property 'forge.logging.console.level', 'debug'

                mods modsClosure
            }

            client {
                property 'forge.enabledGameTestNamespaces', project.mod_id
            }

            server {
                property 'forge.enabledGameTestNamespaces', project.mod_id
                args '--nogui'
            }

            gameTestServer {
                property 'forge.enabledGameTestNamespaces', project.mod_id
            }

            data {
                workingDirectory project.file('run-data')

                args '--mod', project.mod_id, '--all', '--output', project.file('src/generated/resources/'), '--existing', project.file('src/main/resources/')
            }
        }
    }

    // Include resources generated by data generators.
    project.sourceSets.main.resources { srcDir 'src/generated/resources' }
}

// Forge(forge)モジュール共通の設定。
ext.configureForgeModule = { Project project, String commonProjectPath ->
    project.base {
        archivesName = "${project.mod_id}-forge-mc${project.minecraft_version}"
    }

    project.sourceSets.main.resources {
        srcDir project.project(commonProjectPath).file('src/main/resources')
    }

    project.tasks.named('processResources', ProcessResources).configure {
        var replaceProperties = [
                minecraft_version: project.minecraft_version, minecraft_version_range: project.minecraft_version_range,
                forge_version: project.forge_version, forge_version_range: project.forge_version_range,
                loader_version_range: project.loader_version_range,
                mod_id: project.mod_id, mod_name: project.mod_name, mod_license: project.mod_license, mod_version: project.mod_version,
                mod_authors: project.mod_authors, mod_description: project.mod_description,
        ]
        inputs.properties replaceProperties

        filesMatching(['META-INF/mods.toml', 'pack.mcmeta']) {
            expand replaceProperties + [project: project]
        }
    }

    project.tasks.named('jar', Jar).configure {
        from(project.project(commonProjectPath).sourceSets.main.output)
        duplicatesStrategy = DuplicatesStrategy.EXCLUDE

        manifest {
            attributes([
                    'Specification-Title'     : project.mod_id,
                    'Specification-Vendor'    : project.mod_authors,
                    'Specification-Version'   : '1',
                    'Implementation-Title'    : project.name,
                    'Implementation-Version'  : project.jar.archiveVersion,
                    'Implementation-Vendor'   : project.mod_authors,
                    'Implementation-Timestamp': new Date().format("yyyy-MM-dd'T'HH:mm:ssZ")
            ])
        }

        finalizedBy 'reobfJar'

        // mixins.jsonがrefmapを宣言しているのに同梱されていないjarを弾く。
        // refmapはcompileJava時にアノテーションプロセッサが生成するため、common側だけ変更して
        // compileJavaがUP-TO-DATEのままjarだけ作り直すと欠落する。この状態でもビルドは成功し
        // 開発環境でも動くが、本番ではMixinがSRG名を解決できずクラッシュする
        doLast {
            var jarFile = archiveFile.get().asFile
            new java.util.zip.ZipFile(jarFile).withCloseable { zip ->
                zip.entries().findAll { it.name.endsWith('.mixins.json') }.each { entry ->
                    var refmap = new groovy.json.JsonSlurper().parse(zip.getInputStream(entry))['refmap']
                    if (refmap && zip.getEntry(refmap) == null) {
                        throw new GradleException(
                                "${jarFile.name}: ${entry.name}が参照する${refmap}が同梱されていません。" +
                                        "${project.path}:cleanしてビルドし直してください")
                    }
                }
            }
        }
    }
}

// Fabric(fabric)モジュール共通の設定。
ext.configureFabricModule = { Project project, String commonProjectPath ->
    project.base {
        archivesName = "${project.mod_id}-fabric-mc${project.minecraft_version}"
    }

    project.sourceSets.main.resources {
        srcDir project.project(commonProjectPath).file('src/main/resources')
    }

    project.processResources {
        inputs.properties(
                "mod_id": project.mod_id,
                "mod_name": project.mod_name,
                "mod_version": project.mod_version,
                "mod_description": project.mod_description,
                "mod_authors": project.mod_authors,
                "version": project.version
        )

        filesMatching(['fabric.mod.json', 'pack.mcmeta']) {
            expand(inputs.properties)
        }
    }

    project.jar {
        from(project.project(commonProjectPath).sourceSets.main.output)
        duplicatesStrategy = DuplicatesStrategy.EXCLUDE
    }

    project.tasks.withType(JavaCompile).configureEach {
        it.options.release = 17
    }
}
